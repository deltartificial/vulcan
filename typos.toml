[files]
extend-exclude = [
    ".git",
    "target",
    "testdata",
    "test-data",
    "Cargo.toml",
    "Cargo.lock",
    "*.json",
    "*.js",
    "*.css",
    "*.html",
    "**/tests/**",
    "**/test/**",
    "**/*_test.*",
    "**/*_tests.*",
]

[default]
extend-ignore-re = [
    "(?i)0x[0-9a-f]{8}",
    "(?i)0x[0-9a-f]{40}",
    "(?i)0x[0-9a-f]{64}",
    "(?i)[0-9a-f]{8}",
    "(?i)[0-9a-f]{40}",
    "(?i)[0-9a-f]{64}",
    "[0-9]+nd",
    "[0-9]+th",
    "[0-9]+st",
    "[0-9]+rd",
]

[default.extend-words]
ser = "ser"
consts = "consts"
Consts = "Consts"
