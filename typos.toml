[files]
extend-exclude = [
    ".git",
    "target",
    "testdata",
    "test-data",
    "bench_data",
    "Cargo.toml",
    "Cargo.lock",
    "*.json",
    "*.js",
    "*.css",
    "*.html",
    "**/tests/**",
    "**/test/**",
    "**/*_test.*",
    "**/*_tests.*",
]

[default]
# Very short words (four characters or fewer) are acronyms or noise, not typos.
extend-ignore-words-re = [
    "^[a-zA-Z]{1,4}$",
]

extend-ignore-re = [
    # Hex addresses, of any length.
    "(?i)0x[0-9a-f]{8}",
    "(?i)0x[0-9a-f]{40}",
    "(?i)0x[0-9a-f]{64}",
    "(?i)[0-9a-f]{8}",
    "(?i)[0-9a-f]{40}",
    "(?i)[0-9a-f]{64}",
    # Ordinal numbers.
    "[0-9]+nd",
    "[0-9]+th",
    "[0-9]+st",
    "[0-9]+rd",
    # A region between `spellchecker:off` and `spellchecker:on` comments is not checked.
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

# Words that look like typos but are valid, sorted alphabetically.
[default.extend-words]
consts = "consts"
Consts = "Consts"
inout = "inout"
makro = "makro"
optin = "optin"
ser = "ser"

# Identifiers from external APIs that look like typos.
[default.extend-identifiers]
datas = "datas"
selfs = "selfs"
