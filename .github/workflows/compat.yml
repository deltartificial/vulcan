name: compat

# A template that checks backward compatibility: test vectors written by `main` (an encoding, a
# serialization format) must still be read correctly by the branch.
#
# To use it with a codec crate, set `generate-command` to a command that writes the vectors into
# `test-vectors` on `main` (for example `cargo run --bin generate-vectors`), and `verify-command`
# to one that checks them on the branch (`cargo run --bin verify-vectors`). Once both are set,
# the workflow can also run on `pull_request` events.

on:
    workflow_dispatch:
        inputs:
            generate-command:
                description: "Command to generate test vectors from main branch"
                required: true
                default: "cargo xtask help"
            verify-command:
                description: "Command to verify test vectors against PR branch"
                required: true
                default: "cargo xtask help"

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    compat:
        name: backwards compatibility
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true

            - name: Generate test vectors from main
              run: ${{ inputs.generate-command }}

            - name: Save test vectors
              run: cargo xtask compat-save

            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Restore test vectors
              run: cargo xtask compat-restore

            - name: Verify backwards compatibility
              run: ${{ inputs.verify-command }}
